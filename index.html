<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles2.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <title>Device Status Card</title>
    
</head>
<body>

    <div class="card">
        <div class="card-body">
            <!-- Bluetooth Toggle -->
            <div class="status">
                <div class="icon">
                    <img src="https://cdn-icons-png.flaticon.com/128/7578/7578481.png" alt="Bluetooth Icon">
                </div>
                <label class="switch">
                    <input type="checkbox" id="bluetooth-toggle">
                    <span class="slider"><span class="toggle-text"></span></span>
                    <div class="shiny-circle"></div>
                </label>   
            </div>

            <!-- WiFi Toggle -->
            <div class="status">
                <div class="icon">
                    <img src="https://cdn-icons-png.flaticon.com/128/159/159599.png" alt="WiFi Icon">
                </div>
                <label class="switch">
                    <input type="checkbox" id="wifi-toggle">
                    <span class="slider"><span class="toggle-text"></span></span>
                    <div class="shiny-circle"></div>
                </label>
            </div>
        </div>
    </div>

    <!-- Message Box -->
    <div class="message-box">
        <h3>Published Messages</h3>
        <ul id="message-list"></ul>
        <!-- Clear All Button -->
        <button id="clear-messages-btn">Clear All Messages</button>
    </div>

    <script type="text/javascript">
        document.addEventListener("DOMContentLoaded", function () {
            const broker = "wss://broker.emqx.io:8084/mqtt";  
            const clientId = "mqtt_web_" + Math.random().toString(16).substr(2, 8); // Random client ID
            const topicBluetooth = "bluetooth/status";
            const topicWiFi = "wifi/status";
    
            const client = mqtt.connect(broker, {
                clientId: clientId,
                keepalive: 60
            });
    
            client.on("connect", function () {
                console.log("Connected to MQTT Broker!");
            });
    
            client.on("error", function (err) {
                console.log("MQTT Error: ", err);
            });
    
            function handleToggle(event, topic) {
                let status = event.target.checked ? "1" : "0";
                let messageText = `Published to ${topic}: ${status}`;
                console.log(messageText);
    
                client.publish(topic, status, { qos: 0, retain: true });
    
                // Show in message box
                const messageList = document.getElementById("message-list");
                const listItem = document.createElement("li");
                listItem.textContent = messageText;
                messageList.appendChild(listItem);
            }
    
            document.getElementById("bluetooth-toggle").addEventListener("change", function(event) {
                handleToggle(event, topicBluetooth);
            });
    
            document.getElementById("wifi-toggle").addEventListener("change", function(event) {
                handleToggle(event, topicWiFi);
            });

            // Clear All Messages Button Event
            document.getElementById("clear-messages-btn").addEventListener("click", function() {
                const messageList = document.getElementById("message-list");
                messageList.innerHTML = ''; // Clears the message list
            });
        });
        
    </script>

</body>
</html>
